name = "licence-quest-sync"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[observability]
enabled = true

[vars]
# Origin only, no path. Add localhost temporarily for local testing.
ALLOWED_ORIGINS = "https://bmesuere.github.io"

[[kv_namespaces]]
binding = "DRIVING_SYNC"
id = "15b2db5c50584f93affa4d4cc5a09cc7"

# Supplemental protection for a leaked valid sync code. Invalid codes are
# rejected before this limiter or KV is touched.
[[ratelimits]]
name = "WRITE_RATE_LIMITER"
namespace_id = "472019"

  [ratelimits.simple]
  limit = 10
  period = 60
